# Keyless model-facing schema for the Cursor ACP Bundle's provider and preset tool.
# The scripted model does not call the child.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          - id: subagent-cursor
            name: '@deepseek-ai/dsh-subagent-acp'
            config:
              providerName: cursor
              command: cursor-agent
              args: [acp]
              permission: reject
          - id: tool-subagent-cursor
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: cursor
              toolName: subagent_cursor
              backgroundMode: one-shot
              maxDepth: provider-managed
