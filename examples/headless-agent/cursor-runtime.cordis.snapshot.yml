# Keyless Cursor CLI runtime composition for the headless stream-json snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cursor-cli
              model: cursor-fixture
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless Cursor runtime snapshot.'
      - insert:
          - id: llm-cursor-cli
            name: '@deepseek-ai/dsh-llm-cursor-cli'
            config:
              command: node
              extraArgs: ['./cursor-runtime-agent.mjs']
              models:
                - id: cursor-fixture
                  name: Cursor Fixture
